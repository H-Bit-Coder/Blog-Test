<!DOCTYPE html>
<html>
  <head>
    <title>Blog</title>
    <style type="text/css">
      body{
        background-color: rgb(22, 24, 29);
        color: rgb(145, 191, 253);
        font-family: Alexandria, monospace;
        font-size: 12pt;
      }
      .login{
          display: block;
          margin: auto;
          text-align: left;
          background-color: rgb(44, 48, 58);
          color: rgb(145, 191, 253);
          margin-top: 50px;
          width: 250px;
          height: 50px;
          line-height: 50px;
          text-indent: 15px;
          border-style: solid;
          border-radius: 28px;
          border-width: 2px;
          border-color: rgb(84, 108, 141);
          resize: none;
        }
        .login::placeholder{
          color: rgb(145, 191, 253);
        }
    </style>
    <link rel="stylesheet" href="pyscript.net"/>
    <script type="module" src="pyscript.net"></script>
  </head>
  <body>
    <textarea class="login" id="username" placeholder="Username..."></textarea>
    <textarea class="login" id="password" placeholder="Password..."></textarea>
  </body>
</html>
